[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitlev"
version = "0.1.0"
description = "Fast exact edit distance (Levenshtein) for batches of short strings: bit-parallel CPU (NEON) and NVIDIA GPU (CUDA)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13"]

[project.urls]
Homepage = "https://github.com/karims/editdist-bench"

[tool.setuptools]
packages = ["bitlev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
